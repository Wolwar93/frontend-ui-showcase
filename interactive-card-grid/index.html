<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Интерактивная сетка карточек — UI-компонент</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><main class="container"><header class="intro"><span class="eyebrow">03 / UI-КОМПОНЕНТ</span><h1>Интерактивная мозаика</h1><p>Асимметричная адаптивная сетка с анимированными карточками и модальным окном. Выберите любой элемент.</p></header>
<section class="mosaic" aria-label="Каталог форматов">
<button class="tile tile--personal" data-item="0" type="button" aria-haspopup="dialog"><span class="tile__art art--1" aria-hidden="true"></span><span class="tile__body"><strong>Персонально</strong><small>Индивидуальный подход к каждой задаче.</small><span class="tile__more">Подробнее ↗</span></span></button>
<button class="tile tile--group" data-item="1" type="button" aria-haspopup="dialog"><span class="tile__art art--2" aria-hidden="true"></span><span class="tile__body"><strong>Команда</strong><small>Совместная работа и развитие.</small><span class="tile__more">Подробнее ↗</span></span></button>
<button class="tile tile--online" data-item="2" type="button" aria-haspopup="dialog"><span class="tile__art art--3" aria-hidden="true"></span><span class="tile__body"><strong>Онлайн</strong><small>Гибкий формат взаимодействия.</small><span class="tile__more">Подробнее ↗</span></span></button>
<button class="tile tile--plan" data-item="3" type="button" aria-haspopup="dialog"><span class="tile__art art--4" aria-hidden="true"></span><span class="tile__body"><strong>План</strong><small>Структура и последовательность.</small><span class="tile__more">Подробнее ↗</span></span></button>
<button class="tile tile--food" data-item="4" type="button" aria-haspopup="dialog"><span class="tile__art art--5" aria-hidden="true"></span><span class="tile__body"><strong>Консультация</strong><small>Разбор ситуации и рекомендации.</small><span class="tile__more">Подробнее ↗</span></span></button>
</section><p class="footnote">Демонстрационный контент · HTML / CSS Grid / JavaScript</p></main>
<dialog class="modal" aria-labelledby="modalTitle" aria-describedby="modalDescription"><div class="modal__surface"><button class="modal__close" type="button" aria-label="Закрыть окно">×</button><span class="eyebrow">ПОДРОБНОСТИ / ФОРМАТ</span><h2 id="modalTitle"></h2><p id="modalDescription"></p><div class="modal__columns"><div><span class="modal__label">Для кого</span><p id="modalWho"></p></div><div><span class="modal__label">Что входит</span><p id="modalIncludes"></p></div><div><span class="modal__label">Как проходит</span><p id="modalHow"></p></div></div><button class="modal__done" type="button">Вернуться к карточкам ↗</button></div></dialog>
</body></html>
